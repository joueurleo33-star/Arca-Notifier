<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Animal Scanner</title>
    <style>
        body {
            background-color: black;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            padding: 20px;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <pre id="logs">Chargement des logs...</pre>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('https://raw.githack.com/joueurleo33-star/Arca-Notifier/main/animals_logs.json');
                
                if (response.ok) {
                    const rawText = await response.text();
                    const logDiv = document.getElementById('logs');

                    // Si le fichier est vide ou contient juste "[]"
                    if (!rawText || rawText.trim() === "[]" || rawText.trim() === "") {
                        logDiv.innerText = "En attente d'animaux...";
                    } else {
                        // On affiche le texte brut sans le parser en JSON pour éviter les erreurs
                        logDiv.innerText = rawText.replace(/^\[|\]$/g, '').replace(/","/g, '\n').replace(/^"|"$/g, '');
                    }
                } else {
                    document.getElementById('logs').innerText = "Erreur de lecture du fichier (GitHub).";
                }
            } catch (error) {
                document.getElementById('logs').innerText = "Erreur JS : " + error.message;
            }
        }

        // Rafraîchir la page toutes les 3 secondes
        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
