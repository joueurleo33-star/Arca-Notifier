<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Animal Scanner Logs</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;
            padding: 20px;
            margin: 0;
            font-size: 16px;
        }
        #logs { line-height: 1.5; }
        .waiting { color: #888888; }
    </style>
</head>
<body>
    <div id="logs" class="waiting">En attente d'animaux...</div>

    <script>
        async function fetchLogs() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/joueurleo33-star/98SDGY/main/animals_logs.json');
                
                if (response.ok) {
                    // ⚠️ CORRECTION ICI : On utilise .text() au lieu de .json() pour éviter les erreurs de parsing
                    const rawText = await response.text();
                    
                    // Si le fichier n'est pas vide, on l'affiche
                    if (rawText && rawText !== "[]" && rawText !== "En attente d'animaux...") {
                        // On retire les crochets pour afficher juste le texte
                        const cleanText = rawText.replace(/^\[/, '').replace(/\]$/, '').replace(/",\n"/g, '"\n');
                        document.getElementById('logs').innerText = cleanText;
                    } else {
                        document.getElementById('logs').className = 'waiting';
                        document.getElementById('logs').innerText = 'En attente d\'animaux...';
                    }
                } else {
                    document.getElementById('logs').innerText = 'Erreur de lecture du fichier GitHub.';
                }
            } catch (error) {
                document.getElementById('logs').innerText = 'Erreur de connexion: ' + error.message;
            }
        }

        // Actualiser toutes les 3 secondes
        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
