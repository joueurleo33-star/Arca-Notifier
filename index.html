<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 Animal Scanner Logs</title>
    <style>
        /* Styles simples pour avoir une page propre */
        body {
            background-color: #0d0d0d; /* Fond noir/gris foncé */
            color: #00ff00;            /* Texte vert fluo */
            font-family: 'Courier New', Courier, monospace;
            white-space: pre-wrap;     /* Garde les sauts de ligne */
            padding: 20px;
            margin: 0;
            font-size: 16px;
        }
        #logs {
            line-height: 1.5;
        }
        .waiting {
            color: #888888;
        }
    </style>
</head>
<body>
    <div id="logs" class="waiting">En attente d'animaux...</div>

    <script>
        // Fonction pour récupérer les logs depuis GitHub
        async function fetchLogs() {
            try {
                // Lien vers ton fichier JSON sur GitHub
                const response = await fetch('https://raw.githubusercontent.com/joueurleo33-star/98SDGY/main/animals_logs.json');
                
                if (response.ok) {
                    const logs = await response.json();
                    const logContainer = document.getElementById('logs');
                    
                    if (logs.length > 0) {
                        // On affiche les logs, et on retire la classe "waiting" pour changer la couleur
                        logContainer.className = '';
                        logContainer.innerText = logs.join('\n');
                    } else {
                        logContainer.className = 'waiting';
                        logContainer.innerText = 'En attente d\'animaux...';
                    }
                } else {
                    document.getElementById('logs').innerText = 'Erreur de lecture du fichier GitHub.';
                }
            } catch (error) {
                document.getElementById('logs').innerText = 'Erreur de connexion: ' + error.message;
            }
        }

        // Actualiser les logs toutes les 3 secondes
        fetchLogs();
        setInterval(fetchLogs, 3000);
    </script>
</body>
</html>
